<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid-2">
    <label class="field">Data
      <input type="date" formControlName="date">
    </label>
    <label class="field">Valor
      <input type="number" step="0.01" formControlName="amount">
    </label>
  </div>
  <label class="field">Categoria
    <select formControlName="expense_category_id">
      <option [ngValue]="null">Sem categoria</option>
      <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option>
    </select>
  </label>
  <label class="field">Fonte de pagamento
    <select formControlName="payment_method_id">
      <option [ngValue]="null">Sem fonte</option>
      <option *ngFor="let method of methods" [ngValue]="method.id">{{ method.name }}</option>
    </select>
  </label>
  <p class="muted" *ngIf="selectedIsCard()">💳 Cartão de crédito — o gasto fica pendente até o vencimento.</p>
  <label class="field">Descrição
    <textarea formControlName="description"></textarea>
  </label>
  <label class="field">
    <input type="checkbox" formControlName="repeat"> Repetir?
  </label>
  <label class="field" *ngIf="form.value.repeat">Frequência
    <select formControlName="frequency">
      <option value="DAILY">Diária</option>
      <option value="MONTHLY">Mensal</option>
      <option value="YEARLY">Anual</option>
    </select>
  </label>
  <button class="btn" type="submit" [disabled]="form.invalid">Salvar saída</button>
</form>
